<!DOCTYPE html>
<html lang="ko">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #labels-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }
        .building-label {
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.25s ease, transform 0.2s ease;
        }
        .building-label:hover {
            transform: translate(-50%, -108%) scale(1.06);
            z-index: 30;
        }
        .building-label::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 7px 6px 0;
            border-style: solid;
            border-color: rgba(15, 23, 42, 0.92) transparent transparent transparent;
        }
        /* Custom Lego Stud Badge */
        .lego-badge {
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.3);
        }
        /* Custom Range Slider */
        input[type=range] {
            accent-color: #ef4444;
        }
    </style>
</head>

    <script>
        // ============================================================================
        // 1. LEGO CONSTANTS & COLOR PALETTE
        // ============================================================================
        const STUD_PITCH = 1.0;        // 1x1 Lego footprint width/depth
        const BRICK_HEIGHT = 0.8;      // Standard brick layer height
        const STUD_RADIUS = 0.31;      // Top cylinder stud radius
        const STUD_HEIGHT = 0.18;      // Top cylinder stud height

        const PALETTE = {
            BASE_SAND:    { hex: 0xD8CEBE, roughness: 0.45, metalness: 0.02, transparent: false }, // 백사장/마당 마사토
            BASE_GRASS:   { hex: 0x5C8D46, roughness: 0.4,  metalness: 0.02, transparent: false }, // 잔디
            PINE_NEEDLE:  { hex: 0x2E5A27, roughness: 0.45, metalness: 0.02, transparent: false }, // 소나무 잎
            PINE_TRUNK:   { hex: 0x5D4037, roughness: 0.5,  metalness: 0.02, transparent: false }, // 소나무 기둥
            STONE_LIGHT:  { hex: 0xE6E4E0, roughness: 0.35, metalness: 0.05, transparent: false }, // 화강암 월대/육축/돌기둥
            STONE_MID:    { hex: 0xB8BCC2, roughness: 0.35, metalness: 0.05, transparent: false }, // 계단/기단석/어도의 박석
            STONE_DARK:   { hex: 0x7A8088, roughness: 0.4,  metalness: 0.05, transparent: false }, // 담장 하단 암석
            PILLAR_RED:   { hex: 0xC62828, roughness: 0.25, metalness: 0.08, transparent: false }, // 궁궐 주홍 기둥 & 문짝
            DANCHEONG_R:  { hex: 0xE53935, roughness: 0.25, metalness: 0.08, transparent: false }, // 단청 빨강
            DANCHEONG_G:  { hex: 0x00897B, roughness: 0.25, metalness: 0.08, transparent: false }, // 단청 뇌록(초록)
            DANCHEONG_B:  { hex: 0x1E88E5, roughness: 0.25, metalness: 0.08, transparent: false }, // 단청 군청(파랑)
            GOLD_POINT:   { hex: 0xFBC02D, roughness: 0.2,  metalness: 0.35, transparent: false }, // 금박 장식/현판 테두리
            WALL_WHITE:   { hex: 0xF7F5F0, roughness: 0.3,  metalness: 0.03, transparent: false }, // 회벽/창호지
            ROOF_DARK:    { hex: 0x2A3038, roughness: 0.28, metalness: 0.12, transparent: false }, // 전통 기와 (진회색 블록)
            ROOF_RIDGE:   { hex: 0x454D57, roughness: 0.3,  metalness: 0.12, transparent: false }, // 용마루/내림마루 강조 기와
            WATER_TRANS:  { hex: 0x0288D1, roughness: 0.1,  metalness: 0.1,  transparent: true, opacity: 0.84 } // 경회루 연못 반투명 브릭
        };

        // ============================================================================
        // 2. THREE.JS SCENE & CAMERA SETUP
        // ============================================================================
        let scene, camera, renderer, controls;
        let ambientLight, sunLight, hemiLight;
        let isNightMode = false;
        let labelsVisible = true;

        // Voxel storage: key = "x,y,z" -> colorKey
        const voxelGrid = new Map();

        // InstancedMesh groups per colorKey for ultra-fast rendering & assembly animation
        const colorBatches = {};
        const allBrickEntries = []; // Sorted bottom-to-top for assembly animation
        let maxLayerY = 0;

        // Animation State
        let isAssembling = false;
        let isPaused = false;
        let assemblyProgress = 1.0; // 0.0 to 1.0 (in terms of layer progression)
        let assemblySpeed = 1.2;    // Multiplier
        let cameraTargetTween = null;

        // Korean Label Definitions
        const KOREAN_LABELS = [
            {
                id: 'gwanghwamun',
                name: '광화문 (光化門)',
                subtitle: '경복궁의 정문 · 3개의 홍예문과 중층 문루',
                pos: new THREE.Vector3(0, 15.5 * BRICK_HEIGHT, 46),
                camPos: new THREE.Vector3(0, 26, 82),
                lookAt: new THREE.Vector3(0, 6, 44)
            },
            {
                id: 'heungnyemun',
                name: '흥례문 (興禮門)',
                subtitle: '광화문과 근정전 사이의 중층 외대문',
                pos: new THREE.Vector3(0, 13.5 * BRICK_HEIGHT, 16),
                camPos: new THREE.Vector3(16, 24, 42),
                lookAt: new THREE.Vector3(0, 5, 16)
            },
            {
                id: 'geunjeongjeon',
                name: '근정전 (勤政殿)',
                subtitle: '국보 · 2단 월대 위 중층 팔작지붕 정전',
                pos: new THREE.Vector3(0, 24.5 * BRICK_HEIGHT, -18),
                camPos: new THREE.Vector3(24, 30, 14),
                lookAt: new THREE.Vector3(0, 9, -18)
            },
            {
                id: 'gyeonghoeru',
                name: '경회루 (慶會樓)',
                subtitle: '국보 · 방형 연못과 24개 돌기둥 위의 누각',
                pos: new THREE.Vector3(-33, 17.5 * BRICK_HEIGHT, -18),
                camPos: new THREE.Vector3(-58, 28, 15),
                lookAt: new THREE.Vector3(-33, 6, -18)
            },
            {
                id: 'palacewall',
                name: '궁궐 담장 & 동십자각',
                subtitle: '기와를 얹은 화강암·전벽돌 궁장',
                pos: new THREE.Vector3(38, 8.5 * BRICK_HEIGHT, 46),
                camPos: new THREE.Vector3(62, 26, 70),
                lookAt: new THREE.Vector3(25, 4, 35)
            }
        ];

        const labelElements = {};

        // ============================================================================
        // 3. LEGO BRICK GEOMETRY (WITH TOP STUD)
        // ============================================================================
        function createLegoBrickGeometry() {
            // Slight bevel gap (0.96 instead of 1.0) so individual LEGO bricks are clearly visible!
            const bodyWidth = STUD_PITCH * 0.96;
            const bodyHeight = BRICK_HEIGHT * 0.96;
            const bodyDepth = STUD_PITCH * 0.96;

            const boxGeo = new THREE.BoxGeometry(bodyWidth, bodyHeight, bodyDepth);
            // Shift box so its base sits at y=0 and top at y=BRICK_HEIGHT
            boxGeo.translate(0, BRICK_HEIGHT * 0.5, 0);

            // Create the iconic LEGO cylindrical stud on the top surface
            const studGeo = new THREE.CylinderGeometry(STUD_RADIUS, STUD_RADIUS, STUD_HEIGHT, 14);
            studGeo.translate(0, BRICK_HEIGHT + STUD_HEIGHT * 0.5 - 0.01, 0);

            // Merge box + cylinder stud into a single geometry for InstancedMesh
            const mergedGeo = new THREE.BufferGeometry();
            const pos1 = boxGeo.attributes.position.array;
            const norm1 = boxGeo.attributes.normal.array;
            const idx1 = boxGeo.index.array;

            const pos2 = studGeo.attributes.position.array;
            const norm2 = studGeo.attributes.normal.array;
            const idx2 = studGeo.index.array;

            const combinedPos = new Float32Array(pos1.length + pos2.length);
            combinedPos.set(pos1, 0);
            combinedPos.set(pos2, pos1.length);

            const combinedNorm = new Float32Array(norm1.length + norm2.length);
            combinedNorm.set(norm1, 0);
            combinedNorm.set(norm2, norm1.length);

            const combinedIdx = new Uint16Array(idx1.length + idx2.length);
            combinedIdx.set(idx1, 0);
            const vertexOffset = pos1.length / 3;
            for (let i = 0; i < idx2.length; i++) {
                combinedIdx[idx1.length + i] = idx2[i] + vertexOffset;
            }

            mergedGeo.setAttribute('position', new THREE.BufferAttribute(combinedPos, 3));
            mergedGeo.setAttribute('normal', new THREE.BufferAttribute(combinedNorm, 3));
            mergedGeo.setIndex(new THREE.BufferAttribute(combinedIdx, 1));

            return mergedGeo;
        }

        // ============================================================================
        // 4. VOXEL BUILDER HELPERS
        // ============================================================================
        function setBrick(x, y, z, colorKey) {
            if (y < 0) return;
            const ix = Math.round(x);
            const iy = Math.round(y);
            const iz = Math.round(z);
            const key = `${ix},${iy},${iz}`;
            if (colorKey === null) {
                voxelGrid.delete(key);
            } else {
                voxelGrid.set(key, colorKey);
                if (iy > maxLayerY) maxLayerY = iy;
            }
        }

        function fillBricks(x1, y1, z1, x2, y2, z2, colorKey) {
            const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
            const minZ = Math.min(z1, z2), maxZ = Math.max(z1, z2);
            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        setBrick(x, y, z, colorKey);
                    }
                }
            }
        }

        // Builds a colorful Korean Dancheong (Red / Green / Blue) frieze band along the perimeter
        function buildDancheongPerimeter(x1, z1, x2, z2, yStart, height) {
            const pattern = ['DANCHEONG_R', 'DANCHEONG_G', 'DANCHEONG_B', 'DANCHEONG_G'];
            const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
            const minZ = Math.min(z1, z2), maxZ = Math.max(z1, z2);

            for (let dy = 0; dy < height; dy++) {
                const y = yStart + dy;
                for (let x = minX; x <= maxX; x++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        const isEdge = (x === minX || x === maxX || z === minZ || z === maxZ);
                        if (!isEdge) continue;
                        const isCorner = (x === minX || x === maxX) && (z === minZ || z === maxZ);
                        if (isCorner) {
                            setBrick(x, y, z, dy === height - 1 ? 'GOLD_POINT' : 'DANCHEONG_R');
                        } else {
                            const idx = Math.abs(x + z + dy * 2) % pattern.length;
                            setBrick(x, y, z, pattern[idx]);
                        }
                    }
                }
            }
        }

        // Builds a traditional Korean Paljak (hip-and-gable) dark-gray tile roof with upturned eaves (처마) and Dancheong underside
        function buildTraditionalRoof(cx, cz, baseHalfW, baseHalfD, yStart, roofLayers, hasRidge = true) {
            // 1. Colorful Dancheong bracket cornice directly beneath the roof eaves
            const eaveCheckW = baseHalfW - 1;
            const eaveCheckD = baseHalfD - 1;
            buildDancheongPerimeter(
                cx - eaveCheckW, cz - eaveCheckD,
                cx + eaveCheckW, cz + eaveCheckD,
                yStart, 1
            );

            // 2. Stepped Dark Gray Roof Tile Layers
            for (let l = 0; l < roofLayers; l++) {
                const y = yStart + l;
                const shrinkW = l === 0 ? 0 : l;
                const shrinkD = l === 0 ? 0 : l;
                const hw = Math.max(1, baseHalfW - shrinkW);
                const hd = Math.max(1, baseHalfD - shrinkD);

                fillBricks(cx - hw, y, cz - hd, cx + hw, y, cz + hd, 'ROOF_DARK');

                // Upturned corner eaves (버선코 처마곡선) on bottom two layers
                if (l === 0) {
                    const corners = [
                        [cx - hw, cz - hd], [cx + hw, cz - hd],
                        [cx - hw, cz + hd], [cx + hw, cz + hd]
                    ];
                    corners.forEach(([kx, kz]) => {
                        setBrick(kx, y, kz, 'DANCHEONG_G'); // Dancheong tip under corner

                    setBrick(cx + hw, y, cz, (l % 2 === 0) ? 'DANCHEONG_R' : 'DANCHEONG_B');

            // 3. Top Main Ridge (용마루 & 취두)
            if (hasRidge) {
                const topY = yStart + roofLayers;
                const ridgeHalfW = Math.max(2, baseHalfW - roofLayers + 1);
                fillBricks(cx - ridgeHalfW, topY, cz, cx + ridgeHalfW, topY, cz, 'ROOF_RIDGE');
                // Owl-tail ornamental end tiles (취두/용두)
                setBrick(cx - ridgeHalfW, topY + 1, cz, 'ROOF_RIDGE');
                setBrick(cx + ridgeHalfW, topY + 1, cz, 'ROOF_RIDGE');
            }
        }

        // ============================================================================
        // 6. INSTANCED MESH BUILDER & ANIMATION SYSTEM
        // ============================================================================
        function buildInstancedMeshesFromVoxels() {
            // Clear any existing meshes
            Object.values(colorBatches).forEach(batch => {
                if (batch.mesh) scene.remove(batch.mesh);
            });
            allBrickEntries.length = 0;

            const brickGeo = createLegoBrickGeometry();

            // Group voxel coordinates by colorKey
            const grouped = {};
            Object.keys(PALETTE).forEach(k => grouped[k] = []);

            voxelGrid.forEach((colorKey, coordStr) => {
                const [x, y, z] = coordStr.split(',').map(Number);
                if (!grouped[colorKey]) grouped[colorKey] = [];
                grouped[colorKey].push({ x, y, z, colorKey });
            });

            let totalBricks = 0;

            Object.keys(grouped).forEach(colorKey => {
                const list = grouped[colorKey];
                if (list.length === 0) return;

                // Sort bricks bottom-to-top (Y), then front-to-back (Z), then X
                list.sort((a, b) => (a.y - b.y) || (b.z - a.z) || (a.x - b.x));

                const p = PALETTE[colorKey];
                const mat = new THREE.MeshStandardMaterial({
                    color: p.hex,
                    roughness: p.roughness,
                    metalness: p.metalness,
                    transparent: !!p.transparent,
                    opacity: p.opacity !== undefined ? p.opacity : 1.0
                });

                const instMesh = new THREE.InstancedMesh(brickGeo, mat, list.length);
                instMesh.castShadow = !p.transparent;
                instMesh.receiveShadow = true;

                const dummy = new THREE.Object3D();
                list.forEach((brick, idx) => {
                    brick.instanceIndex = idx;
                    brick.batchKey = colorKey;
                    // Subtle deterministic jitter so assembly drop feels organic
                    brick.orderOffset = ((Math.sin(brick.x * 12.9898 + brick.z * 78.233) * 43758.5453) % 1 + 1) % 1;

                    dummy.position.set(brick.x * STUD_PITCH, brick.y * BRICK_HEIGHT, brick.z * STUD_PITCH);
                    dummy.scale.set(1, 1, 1);
                    dummy.updateMatrix();
                    instMesh.setMatrixAt(idx, dummy.matrix);

                    allBrickEntries.push(brick);
                    totalBricks++;
                });

                instMesh.instanceMatrix.needsUpdate = true;
                scene.add(instMesh);

                colorBatches[colorKey] = {
                    mesh: instMesh,
                    bricks: list
                };
            });

            // Update total brick counter badge
            const counterEl = document.getElementById('brick-counter');
            if (counterEl) {
                counterEl.textContent = `총 ${totalBricks.toLocaleString()} 브릭`;
            }
        }

        // Updates brick positions/scales based on `assemblyProgress` (0.0 to 1.0)
        const tempMatrix = new THREE.Matrix4();
        const tempPos = new THREE.Vector3();
        const tempQuat = new THREE.Quaternion();
        const tempScale = new THREE.Vector3();

        function updateBricksForAssembly(progress) {
            // Map progress (0..1) across layers (-1 .. maxLayerY + 3)
            const totalVirtualLayers = maxLayerY + 3.5;
            const currentVirtualLayer = progress * totalVirtualLayers;

            Object.keys(colorBatches).forEach(colorKey => {
                const batch = colorBatches[colorKey];
                const mesh = batch.mesh;

                for (let i = 0; i < batch.bricks.length; i++) {
                    const b = batch.bricks[i];
                    const brickStartLayer = b.y + b.orderOffset * 0.65;
                    const localT = (currentVirtualLayer - brickStartLayer) / 1.4;

                    if (localT <= 0) {
                        // Hidden (not yet placed)
                        tempPos.set(b.x * STUD_PITCH, -100, b.z * STUD_PITCH);
                        tempScale.set(0.0001, 0.0001, 0.0001);
                    } else if (localT >= 1 || progress >= 0.999) {
                        // Locked into final LEGO stud position
                        tempPos.set(b.x * STUD_PITCH, b.y * BRICK_HEIGHT, b.z * STUD_PITCH);
                        tempScale.set(1, 1, 1);
                    } else {
                        // Dropping from above with snappy LEGO click bounce
                        const easeOut = 1 - Math.pow(1 - localT, 3);
                        const dropHeight = (1 - easeOut) * 9.5;
                        const s = Math.min(1, localT * 2.2);
                        tempPos.set(
                            b.x * STUD_PITCH,
                            b.y * BRICK_HEIGHT + dropHeight,
                            b.z * STUD_PITCH
                        );
                        tempScale.set(s, s, s);
                    }

                    tempMatrix.compose(tempPos, tempQuat, tempScale);
                    mesh.setMatrixAt(i, tempMatrix);
                }
                mesh.instanceMatrix.needsUpdate = true;
            });

            // Sync UI elements
            const slider = document.getElementById('build-slider');
            if (slider && Math.abs(slider.value - progress * 1000) > 1) {
                slider.value = Math.round(progress * 1000);
            }

            const currentLayerNum = Math.min(maxLayerY, Math.max(0, Math.floor(progress * (maxLayerY + 1))));
            const layerInd = document.getElementById('layer-indicator');
            if (layerInd) {
                layerInd.textContent = `층: ${currentLayerNum} / ${maxLayerY}`;
            }

            const stageText = document.getElementById('build-stage-text');
            if (stageText) {
                const pct = Math.round(progress * 100);
                let stageDesc = '완성 상태';
                if (pct === 0) stageDesc = '기초 준비 중';
                else if (pct < 15) stageDesc = '궁궐 터·연못·기단 조립 중';
                else if (pct < 38) stageDesc = '광화문 석축·2단 월대·담장 조립 중';
                else if (pct < 68) stageDesc = '전각 붉은 기둥·단청 공포 조립 중';
                else if (pct < 99) stageDesc = '팔작지붕 진회색 기와·용마루 조립 중';
                stageText.textContent = `${stageDesc} (${pct}%)`;
            }
        }

        // ============================================================================
        // 7. KOREAN 3D LABELS & UI CONTROLS
        // ============================================================================
        function initKoreanLabels() {
            const container = document.getElementById('labels-container');
            container.innerHTML = '';

            KOREAN_LABELS.forEach(item => {
                const el = document.createElement('div');
                el.className = 'building-label bg-slate-900/92 backdrop-blur-md border border-amber-400/60 px-3.5 py-2 rounded-xl shadow-xl text-center';
                el.innerHTML = `
                    <div class="text-xs sm:text-sm font-black text-amber-300 tracking-tight whitespace-nowrap">${item.name}</div>
                    <div class="text-[10px] text-slate-300 font-medium whitespace-nowrap hidden sm:block">${item.subtitle}</div>
                `;
                el.onclick = () => focusBuilding(item.id);
                container.appendChild(el);
                labelElements[item.id] = el;
            });
        }

        function updateKoreanLabels() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const halfW = width / 2;
            const halfH = height / 2;

            KOREAN_LABELS.forEach(item => {
                const el = labelElements[item.id];
                if (!el) return;

                if (!labelsVisible) {
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                    return;
                }

                // Project 3D world position to 2D screen coordinates
                const projected = item.pos.clone().project(camera);

                // Check if behind camera
                if (projected.z > 1) {
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                    return;
                }

                const screenX = (projected.x * halfW) + halfW;
                const screenY = -(projected.y * halfH) + halfH;

                el.style.left = `${screenX}px`;
                el.style.top = `${screenY}px`;
                el.style.opacity = '1';
                el.style.pointerEvents = 'auto';
            });
        }

        // Assembly Button Handlers
        function startAssemblyAnimation() {
            if (assemblyProgress >= 0.98) {
                assemblyProgress = 0.0;
            }
            isAssembling = true;
            isPaused = false;

            document.getElementById('btn-assemble-text').textContent = '처음부터 다시 조립';
            const pauseBtn = document.getElementById('btn-pause');
            pauseBtn.classList.remove('hidden');
            pauseBtn.classList.add('flex');
            document.getElementById('btn-pause-text').textContent = '일시정지';
        }

        function togglePauseAssembly() {
            if (!isAssembling) return;
            isPaused = !isPaused;
            document.getElementById('btn-pause-text').textContent = isPaused ? '계속 조립' : '일시정지';
        }

        function instantComplete() {
            isAssembling = false;
            isPaused = false;
            assemblyProgress = 1.0;
            updateBricksForAssembly(1.0);
            document.getElementById('btn-assemble-text').textContent = '조립하기';
            const pauseBtn = document.getElementById('btn-pause');
            pauseBtn.classList.add('hidden');
            pauseBtn.classList.remove('flex');
        }

        function setSpeed(spd) {
            assemblySpeed = spd;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.className = 'speed-btn px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition';
            });
            const activeBtn = document.getElementById(`speed-${spd}`);
            if (activeBtn) {
                activeBtn.className = 'speed-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition';
            }
        }

        function toggleLabels() {
            labelsVisible = !labelsVisible;
            const btn = document.getElementById('btn-toggle-labels');
            if (labelsVisible) {
                btn.textContent = '이름표 켜짐';
                btn.className = 'px-3 py-1.5 text-xs sm:text-sm font-bold rounded-xl bg-indigo-600/90 hover:bg-indigo-500 text-white transition active:scale-95';
            } else {
                btn.textContent = '이름표 꺼짐';
                btn.className = 'px-3 py-1.5 text-xs sm:text-sm font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 transition active:scale-95';
            }
        }

        function toggleDayNight() {
            isNightMode = !isNightMode;
            const btn = document.getElementById('btn-toggle-time');
            if (isNightMode) {
                scene.background = new THREE.Color(0x090d16);
                scene.fog.color.setHex(0x090d16);
                ambientLight.intensity = 0.35;
                hemiLight.intensity = 0.25;
                sunLight.intensity = 0.75;
                sunLight.color.setHex(0xffd599);
                btn.textContent = '🌙 야간 개장';
                btn.className = 'px-3 py-1.5 text-xs sm:text-sm font-bold rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/30 transition active:scale-95';
            } else {
                scene.background = new THREE.Color(0x1e293b);
                scene.fog.color.setHex(0x1e293b);
                ambientLight.intensity = 0.65;
                hemiLight.intensity = 0.55;
                sunLight.intensity = 1.15;
                sunLight.color.setHex(0xfffbeb);
                btn.textContent = '☀️ 주간';
                btn.className = 'px-3 py-1.5 text-xs sm:text-sm font-bold rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 transition active:scale-95';
            }
        }

        function focusBuilding(id) {
            if (id === 'all') {
                cameraTargetTween = {
                    camPos: new THREE.Vector3(48, 52, 92),
                    lookAt: new THREE.Vector3(-4, 4, 2)
                };
                return;
            }
            const found = KOREAN_LABELS.find(l => l.id === id);
            if (found) {
                cameraTargetTween = {
                    camPos: found.camPos.clone(),
                    lookAt: found.lookAt.clone()
                };
            }
        }

        // ============================================================================
        // 8. INITIALIZATION & MAIN ANIMATION LOOP
        // ============================================================================
        function initApp() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b);
            scene.fog = new THREE.FogExp2(0x1e293b, 0.0032);

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 450);
            camera.position.set(48, 52, 92);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // OrbitControls for Mouse Rotate / Zoom / Pan
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(-4, 4, 2);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI / 2 - 0.03; // Keep camera above the baseplate
            controls.minDistance = 15;
            controls.maxDistance = 210;

            // Cancel camera tween if user manually interacts
            renderer.domElement.addEventListener('pointerdown', () => {
                cameraTargetTween = null;
            });

            // Lighting Setup for glossy plastic LEGO bricks
            ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x334155, 0.55);
            hemiLight.position.set(0, 80, 0);
            scene.add(hemiLight);

            sunLight = new THREE.DirectionalLight(0xfffbeb, 1.15);
            sunLight.position.set(65, 95, 75);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 260;
            const d = 75;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            // Dark wooden display table beneath the LEGO baseplate
            const tableGeo = new THREE.BoxGeometry(104, 2.2, 110);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });
            const tableMesh = new THREE.Mesh(tableGeo, tableMat);
            tableMesh.position.set(-6, -1.15, 3);
            tableMesh.receiveShadow = true;
            scene.add(tableMesh);

            // Build Gyeongbokgung Voxels & InstancedMeshes
            generateGyeongbokgungBricks();
            buildInstancedMeshesFromVoxels();
            initKoreanLabels();
            updateBricksForAssembly(1.0);

            // Slider scrub listener
            const slider = document.getElementById('build-slider');
            slider.addEventListener('input', (e) => {
                isAssembling = false;
                isPaused = false;
                document.getElementById('btn-pause').classList.add('hidden');
                document.getElementById('btn-pause').classList.remove('flex');
                assemblyProgress = parseFloat(e.target.value) / 1000;
                updateBricksForAssembly(assemblyProgress);
            });

            // Responsive resize listener
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        let lastTime = performance.now();

        function animate(now = performance.now()) {
            requestAnimationFrame(animate);

            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            // Handle smooth camera preset transition
            if (cameraTargetTween) {
                camera.position.lerp(cameraTargetTween.camPos, 0.07);
                controls.target.lerp(cameraTargetTween.lookAt, 0.07);
                if (camera.position.distanceTo(cameraTargetTween.camPos) < 0.35) {
                    cameraTargetTween = null;
                }
            }

            // Handle brick-by-brick assembly animation from bottom to top
            if (isAssembling && !isPaused) {
                assemblyProgress += dt * 0.14 * assemblySpeed;
                if (assemblyProgress >= 1.0) {
                    assemblyProgress = 1.0;
                    isAssembling = false;
                    const pauseBtn = document.getElementById('btn-pause');
                    pauseBtn.classList.add('hidden');
                    pauseBtn.classList.remove('flex');
                    document.getElementById('btn-assemble-text').textContent = '조립하기';
                }
                updateBricksForAssembly(assemblyProgress);
            }

            controls.update();
            updateKoreanLabels();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            initApp();
            animate();
        };
    </script>
</body>
</html>
