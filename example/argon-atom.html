<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아르곤(Ar) 원자 모형</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent-color: #3b82f6;
            --nucleus-color: #ef4444;
            --electron-color: #2563eb;
            --orbit-color: #cbd5e1;
            --orbit-hover: #94a3b8;
            --orbit-active: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: row;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
            min-height: 600px;
        }

        /* 왼쪽 원자 모형 영역 */
        .atom-section {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 500px;
            background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
            overflow: hidden;
        }

        .atom-container {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 원자핵 */
        .nucleus {
            width: 54px;
            height: 54px;
            background: radial-gradient(circle at 30% 30%, #f87171, var(--nucleus-color));
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nucleus:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
        }

        .nucleus.active {
            outline: 4px solid rgba(239, 68, 68, 0.3);
            transform: scale(1.05);
        }

        /* 전자껍질 (궤도) */
        .shell {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed var(--orbit-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        /* 클릭 영역 확장을 위한 가상 요소 */
        .shell::after {
            content: '';
            position: absolute;
            top: -10px; bottom: -10px; left: -10px; right: -10px;
            border-radius: 50%;
            z-index: 1;
        }

        .shell:hover {
            border-color: var(--orbit-hover);
            border-style: solid;
        }

        .shell.active {
            border-color: var(--orbit-active);
            border-style: solid;
            border-width: 3px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2), inset 0 0 15px rgba(59, 130, 246, 0.2);
        }

        /* 껍질별 크기 및 애니메이션 */
        .shell-1 {
            width: 140px;
            height: 140px;
            z-index: 4;
            animation: spin 12s linear infinite;
        }

        .shell-2 {
            width: 260px;
            height: 260px;
            z-index: 3;
            animation: spin 20s linear infinite reverse;
        }

        .shell-3 {
            width: 380px;
            height: 380px;
            z-index: 2;
            animation: spin 30s linear infinite;
        }

        .atom-container:hover .shell {
            /* 마우스 오버시 애니메이션 속도 조절 효과 대신 일시정지를 원할 경우 주석 해제 */
            /* animation-play-state: paused; */
        }

        /* 전자 */
        .electron {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #60a5fa, var(--electron-color));
            border-radius: 50%;
            top: 50%;
            left: 50%;
            margin-top: -7px;
            margin-left: -7px;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.6);
            pointer-events: none; /* 클릭 이벤트가 껍질로 전달되도록 */
            transition: transform 0.3s, background 0.3s;
        }

        .shell.active .electron {
            background: radial-gradient(circle at 30% 30%, #93c5fd, #1d4ed8);
            box-shadow: 0 0 12px rgba(29, 78, 216, 0.9);
            transform: scale(1.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 오른쪽 정보 카드 영역 */
        .info-section {
            flex: 0.8;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--card-bg);
            border-left: 1px solid #e2e8f0;
        }

        .header-badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            width: fit-content;
        }

        .info-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .info-subtitle {
            font-size: 16px;
            color: var(--text-sub);
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--bg-color);
            padding: 16px;
            border-radius: 12px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .info-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #334155;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-color);
        }

        .guide-text {
            position: absolute;
            bottom: 20px;
            font-size: 13px;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.8);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* 반응형 처리 */
        @media (max-width: 850px) {
            .container {
                flex-direction: column;
            }
            .atom-section {
                min-height: 450px;
            }
            .info-section {
                border-left: none;
                border-top: 1px solid #e2e8f0;
                padding: 30px 24px;
            }
        }
        @media (max-width: 480px) {
            .atom-container {
                transform: scale(0.75);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 원자 모형 영역 -->
    <div class="atom-section">
        <div class="atom-container">
            <!-- 원자핵 -->
            <div class="nucleus" data-target="nucleus">18Ar</div>
            <!-- 껍질들은 JS를 통해 전자가 배치됩니다 -->
            <div class="shell shell-1" data-target="shell1" data-electrons="2" data-radius="70"></div>
            <div class="shell shell-2" data-target="shell2" data-electrons="8" data-radius="130"></div>
            <div class="shell shell-3" data-target="shell3" data-electrons="8" data-radius="190"></div>
        </div>
        <div class="guide-text">💡 원자핵이나 전자껍질(궤도)을 클릭해 보세요</div>
    </div>

    <!-- 설명 카드 영역 -->
    <div class="info-section">
        <div class="header-badge" id="badge">원자 번호 18번</div>
        <h1 class="info-title" id="title">아르곤 (Argon)</h1>
        <p class="info-subtitle" id="subtitle">비활성 기체 · 3주기 18족 원소</p>
        
        <div class="info-stats">
            <div class="stat-box">
                <div class="stat-label" id="stat1-label">총 전자 수</div>
                <div class="stat-value" id="stat1-value">18개</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" id="stat2-label">원자가 전자</div>
                <div class="stat-value" id="stat2-value">0개 (안정)</div>
            </div>
        </div>

        <div class="info-desc" id="description">
            아르곤은 지구 대기에서 세 번째로 많은 기체입니다. 가장 바깥쪽 전자껍질에 8개의 전자가 모두 채워져 있어(옥텟 규칙 만족) 다른 원소와 거의 반응하지 않는 매우 안정한 '비활성 기체'입니다.
        </div>
    </div>
</div>

<script>
    // 각 부위별 설명 데이터
    const data = {
        default: {
            badge: "원자 번호 18번",
            title: "아르곤 (Argon)",
            subtitle: "비활성 기체 · 3주기 18족 원소",
            stat1Label: "총 전자 수",
            stat1Value: "18개",
            stat2Label: "전자 배치",
            stat2Value: "2 · 8 · 8",
            desc: "아르곤은 지구 대기에서 세 번째로 많은 기체입니다. 가장 바깥쪽 전자껍질에 8개의 전자가 모두 채워져 있어(옥텟 규칙 만족) 화학적으로 매우 안정한 '비활성 기체'입니다."
        },
        nucleus: {
            badge: "중심부",
            title: "원자핵 (Nucleus)",
            subtitle: "양성자 18개 + 중성자 22개",
            stat1Label: "전하량",
            stat1Value: "+18",
            stat2Label: "질량수",
            stat2Value: "약 40 (³⁹.⁹⁴⁸)",
            desc: "원자의 중심에 위치하며 원자의 질량 대부분을 차지합니다. 18개의 양성자가 있어 +18의 양전하를 띠며, 이로 인해 18개의 음전하를 띤 전자를 주변에 붙잡아 둘 수 있습니다."
        },
        shell1: {
            badge: "첫 번째 궤도 (n=1)",
            title: "K 전자껍질",
            subtitle: "가장 안쪽에 위치한 에너지 준위",
            stat1Label: "현재 전자 수",
            stat1Value: "2개",
            stat2Label: "최대 수용 가능",
            stat2Value: "2개 (포화)",
            desc: "원자핵에 가장 가까운 첫 번째 전자껍질입니다. 에너지 준위가 가장 낮아 전자가 가장 먼저 채워지며, 최대 2개의 전자만 들어갈 수 있습니다. (1s²)"
        },
        shell2: {
            badge: "두 번째 궤도 (n=2)",
            title: "L 전자껍질",
            subtitle: "중간에 위치한 에너지 준위",
            stat1Label: "현재 전자 수",
            stat1Value: "8개",
            stat2Label: "최대 수용 가능",
            stat2Value: "8개 (포화)",
            desc: "K 껍질 다음으로 전자가 채워지는 두 번째 껍질입니다. 최대 8개의 전자가 들어갈 수 있으며, 아르곤의 경우 8개가 모두 가득 차 있어 안정적인 내부 껍질을 형성합니다. (2s² 2p⁶)"
        },
        shell3: {
            badge: "세 번째 궤도 (n=3)",
            title: "M 전자껍질 (최외각 껍질)",
            subtitle: "아르곤의 가장 바깥쪽 껍질",
            stat1Label: "현재 전자 수",
            stat1Value: "8개",
            stat2Label: "화학적 성질",
            stat2Value: "비활성 (안정)",
            desc: "아르곤의 가장 바깥쪽(최외각) 전자껍질입니다. 물리적으로는 최대 18개까지 들어갈 수 있지만, 가장 바깥 껍질에 8개가 채워지면(3s² 3p⁶) '옥텟 규칙'에 의해 극도의 안정성을 갖게 되어 더 이상 반응하지 않습니다."
        }
    };

    // 전자 생성 및 원형 배치
    const shells = document.querySelectorAll('.shell');
    
    shells.forEach(shell => {
        const count = parseInt(shell.getAttribute('data-electrons'));
        const radius = parseInt(shell.getAttribute('data-radius'));
        
        for (let i = 0; i < count; i++) {
            const electron = document.createElement('div');
            electron.className = 'electron';
            
            // 각도 계산 (균등 분할)
            const angle = (360 / count) * i;
            
            // 회전 후 반지름만큼 이동하여 원 궤도에 배치
            electron.style.transform = `rotate(${angle}deg) translate(${radius}px)`;
            
            shell.appendChild(electron);
        }
    });

    // 인터랙션 처리
    const interactiveElements = document.querySelectorAll('[data-target]');
    const badgeEl = document.getElementById('badge');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const stat1LabelEl = document.getElementById('stat1-label');
    const stat1ValueEl = document.getElementById('stat1-value');
    const stat2LabelEl = document.getElementById('stat2-label');
    const stat2ValueEl = document.getElementById('stat2-value');
    const descEl = document.getElementById('description');

    function updateCard(targetKey) {
        const info = data[targetKey] || data.default;
        
        // 텍스트 업데이트 및 간단한 페이드 효과
        const infoSection = document.querySelector('.info-section');
        infoSection.style.opacity = 0.5;
        
        setTimeout(() => {
            badgeEl.textContent = info.badge;
            titleEl.textContent = info.title;
            subtitleEl.textContent = info.subtitle;
            stat1LabelEl.textContent = info.stat1Label;
            stat1ValueEl.textContent = info.stat1Value;
            stat2LabelEl.textContent = info.stat2Label;
            stat2ValueEl.textContent = info.stat2Value;
            descEl.textContent = info.desc;
            
            // 원자핵 선택 시 배지 색상 변경
            if(targetKey === 'nucleus') {
                badgeEl.style.background = '#fef2f2';
                badgeEl.style.color = '#ef4444';
                descEl.style.borderLeftColor = '#ef4444';
            } else {
                badgeEl.style.background = '#eff6ff';
                badgeEl.style.color = '#3b82f6';
                descEl.style.borderLeftColor = '#3b82f6';
            }

            infoSection.style.opacity = 1;
        }, 150);
    }

    document.querySelector('.info-section').style.transition = 'opacity 0.15s ease-in-out';

    interactiveElements.forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation(); // 이벤트 버블링 방지 (껍질 중첩 클릭 방지)
            
            const target = el.getAttribute('data-target');
            const isAlreadyActive = el.classList.contains('active');

            // 모든 활성화 클래스 제거
            interactiveElements.forEach(item => item.classList.remove('active'));

            if (isAlreadyActive) {
                // 이미 선택된 것을 다시 누르면 기본(전체) 정보로 복귀
                updateCard('default');
            } else {
                el.classList.add('active');
                updateCard(target);
            }
        });
    });

    // 배경 클릭 시 초기화
    document.querySelector('.atom-section').addEventListener('click', () => {
        interactiveElements.forEach(item => item.classList.remove('active'));
        updateCard('default');
    });
</script>

</body>
</html>
